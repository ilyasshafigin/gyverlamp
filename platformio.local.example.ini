[platformio]
default_envs = lamp1_ota

[env]
build_flags =
  -std=gnu++17
  -D GMT=3
  -D USE_BUTTON
  -D USE_MQTT
  -D USE_OTA

; === lamp1 - ESP8266 Wemos D1 mini ===
[env:lamp1_base]
extends = target_d1_mini
build_flags =
  ${env.build_flags}
  -D DEVICE_NAME=\"GyverLamp1\"
  -D CURRENT_LIMIT=3000

[env:lamp1_usb]
extends = env:lamp1_base
upload_protocol = esptool

[env:lamp1_ota]
extends = env:lamp1_base
upload_protocol = espota
upload_port = 192.168.1.xxx

; === lamp2 - ESP32 ===
[env:lamp2_base]
extends = target_esp32dev
build_flags =
  ${env.build_flags}
  -D DEVICE_NAME=\"GyverLamp2\"
  -D CURRENT_LIMIT=3000
  -D USE_ADC
  -D USE_UDP

[env:lamp2_usb]
extends = env:lamp2_base
upload_protocol = esptool

; === lamp3 - ESP32-S3-Zero (ESP32-S3FH4R2, 4 MB flash, 2 MB PSRAM) ===
[env:lamp3_base]
extends = target_esp32_s3_zero
build_flags =
  ${env.build_flags}
  -D DEVICE_NAME=\"GyverLamp3\"
  -D CURRENT_LIMIT=3000
  -D USE_ADC

[env:lamp3_usb]
extends = env:lamp3_base
upload_protocol = esptool
